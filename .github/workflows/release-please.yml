name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read package.json version
        id: pkg-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ steps.pkg-version.outputs.version }}
      # Hand-written highlights for a version go in
      # .github/release-notes/<version>.md. When the release is created they
      # are put above the generated list of changes.
      - name: Add highlights to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          NOTES=".github/release-notes/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "No highlights in $NOTES, keeping the generated notes."
            exit 0
          fi
          gh release view "$TAG" --json body --jq .body > generated.md
          {
            cat "$NOTES"
            printf '\n---\n\n'
            cat generated.md
          } > release.md
          gh release edit "$TAG" --notes-file release.md
